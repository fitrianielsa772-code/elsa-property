<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elsa Property - Marketplace Properti Profesional</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body{
  font-family:'Poppins',sans-serif;
  margin:0;
  background:#f4f6f9;
}

header{
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color:white;
  padding:60px 20px;
  text-align:center;
}

header h1{
  font-size:40px;
  margin:0;
}

.search-box{
  text-align:center;
  margin:30px;
}

.search-box input{
  padding:12px;
  width:300px;
  border-radius:30px;
  border:1px solid #ccc;
}

.container{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:25px;
  padding:30px;
}

.card{
  background:white;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 8px 20px rgba(0,0,0,0.08);
  transition:0.3s;
}

.card:hover{
  transform:translateY(-8px);
}

.card img{
  width:100%;
  height:220px;
  object-fit:cover;
}

.card-body{
  padding:20px;
}

.card-body h3{
  margin:0 0 10px 0;
}

.card-body p{
  font-size:14px;
  white-space:pre-line;
  color:#555;
}

.price{
  background:#0f2027;
  color:white;
  padding:10px;
  border-radius:8px;
  text-align:center;
  margin:15px 0;
  font-weight:bold;
}

.btn-wa{
  display:block;
  text-align:center;
  background:#25D366;
  color:white;
  padding:10px;
  border-radius:8px;
  text-decoration:none;
}

.btn-wa:hover{
  background:#1ebe5d;
}

.loading{
  text-align:center;
  font-size:18px;
  padding:50px;
}

.wa-float{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#25D366;
  color:white;
  padding:15px 20px;
  border-radius:50px;
  text-decoration:none;
  font-weight:bold;
  box-shadow:0 4px 10px rgba(0,0,0,0.3);
}

@media(max-width:600px){
  header h1{font-size:28px;}
  .search-box input{width:90%;}
}
</style>
</head>

<body>

<header>
  <h1>ELSA PROPERTY</h1>
  <p>Marketplace Properti Profesional & Terpercaya</p>
</header>

<div class="search-box">
  <input type="text" id="search" placeholder="Cari properti...">
</div>

<div id="loading" class="loading">Memuat properti...</div>

<div class="container" id="property-list"></div>

<a href="https://wa.link/aqoymb" class="wa-float">Hubungi Kami</a>

<script>
const sheetURL = "https://opensheet.elk.sh/2PACX-1vTnJfpJJw13UmcMFX0pcrLqNW3twSFwk3KkCx54TSoRN3Vf83_tvZrLB5CF7yztmxsCTVPd_vKnZH9p/Sheet1";

let properties = [];

fetch(sheetURL)
.then(res=>res.json())
.then(data=>{
  properties = data;
  document.getElementById("loading").style.display="none";
  displayProperties(data);
});

function displayProperties(data){
  const container=document.getElementById("property-list");
  container.innerHTML="";
  data.forEach(item=>{
    container.innerHTML+=`
    <div class="card">
      <img src="${item.gambar}">
      <div class="card-body">
        <h3>${item.judul}</h3>
        <p>${item.spesifikasi}</p>
        <div class="price">
          RP ${parseInt(item.harga).toLocaleString('id-ID')} / Unit
        </div>
        <a class="btn-wa"
          href="https://wa.me/${item.whatsapp}?text=Halo%20Saya%20tertarik%20dengan%20${item.judul}"
          target="_blank">
          Tanya via WhatsApp
        </a>
      </div>
    </div>
    `;
  });
}

document.getElementById("search").addEventListener("keyup",function(){
  const keyword=this.value.toLowerCase();
  const filtered=properties.filter(p=>
    p.judul.toLowerCase().includes(keyword)
  );
  displayProperties(filtered);
});
</script>

</body>
</html>
